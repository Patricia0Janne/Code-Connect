<!doctype html>
<html lang="pt-br">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Prompt:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="styles.css" />
    <title>CodeConnect</title>
  </head>

  <body>
    <aside>
      <img src="./assets/Logo.svg" alt="logo do CodeConnect" />
      <nav>
        <ul class="lista-links">
          <li>
            <a href="#" class="link-publicar">Publicar</a>
          </li>
          <li>
            <a href="teste.html">
              <img src="./assets/feed.svg" />
              Feed
            </a>
          </li>
          <li>
            <a href="#">
              <img src="./assets/account_circle.svg" />
              Perfil
            </a>
          </li>
          <li>
            <a href="#">
              <img src="./assets/info.svg" />
              Sobre nós
            </a>
          </li>
          <li>
            <a href="#">
              <img src="./assets/logout.svg" />
              Sair
            </a>
          </li>
        </ul>
      </nav>
    </aside>

    <main>
      <div class="container-carregar-img">
        <div class="container-img">
          <img src="img/imagem1.png" alt="" class="main-image" />
        </div>
        <button type="button" class="botao-carregar" id="upload-btn">
          Carregar imagem
        </button>
        <input
          type="file"
          id="imagem-upload"
          accept=" image/"
          style="display: none"
        />
        <div class="container-img-nome">
          <p>Imagem_projeto.png</p>
          <img src="./assets/close.svg" />
        </div>
      </div>
      <div class="container-form-projeto">
        <h2 class="titulo-projeto">Novo Projeto</h2>
        <form>
          <div>
            <label for="nome">Nome do Projeto</label>
            <input type="text" id="nome" name="nome" />
          </div>
          <div>
            <label for="descricao">Descrição</label>
            <textarea type="text" id="descricao" name="descricao"></textarea>
          </div>
          <div>
            <label for="categoria">Tags</label>
            <input type="categoria" id="categoria" name="categoria" />
          </div>
          <ul class="lista-tags" id="lista-tags"></ul>
          <div class="container-botoes">
            <button type="button" class="botao-descartar">Descartar</button>
            <button type="button" class="botao-publicar">Publicar</button>
          </div>
        </form>
      </div>
    </main>

    <script src="scripts.js"></script>
  </body>
</html>
